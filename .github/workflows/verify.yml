name: Verify Cloudflare application
on:
  push:
    branches: [main, "t3code/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck:test
      - run: bun run test
      - run: node --experimental-strip-types scripts/verify-d1-runtime.ts
      - run: node scripts/verify-scheduler-runtime.mjs
      - run: bun run build:cloudflare
